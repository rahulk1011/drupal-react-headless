services:
  apiservices.cross_origin_session_cookie_subscriber:
    class: Drupal\apiservices\EventSubscriber\CrossOriginSessionCookieSubscriber
    tags:
      - { name: event_subscriber }

  apiservices.maintenance_api_subscriber:
    class: Drupal\apiservices\EventSubscriber\MaintenanceApiSubscriber
    arguments: ['@maintenance_mode', '@current_user']
    tags:
      - { name: event_subscriber }
